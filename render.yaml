services:
  - type: web
    name: fridgechef-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ENVIRONMENT
        value: production
      - key: LANGFUSE_ENABLED
        value: "false"
      - key: REVENUECAT_SECRET_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: REVENUECAT_ENTITLEMENT
        value: fridgeout_pro
      - key: IOS_SUBSCRIPTION_PRODUCT_ID
        value: fridgeout_pro_monthly
      - key: SUBSCRIPTION_MONTHLY_USES
        value: "20"
      - key: BILLING_ALLOW_SANDBOX
        value: "false"
      - key: CORS_ORIGINS
        value: http://localhost:8081,http://localhost:19006
